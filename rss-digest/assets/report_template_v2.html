<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日资讯报告 - {{DATE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Prevent automatic phone/link detection */
        a {
            text-decoration: none;
            color: #667eea;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Prevent auto-detection in insight content */
        .insight-content {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .insight-content p,
        .insight-content h4,
        .insight-content h5,
        .insight-content li {
            text-decoration: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            color: #2c3e50;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
            font-weight: 300;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px 40px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-label {
            font-weight: 600;
            color: #495057;
            margin-right: 8px;
        }

        .filter-tag {
            padding: 8px 18px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            font-weight: 500;
            color: #495057;
        }

        .filter-tag:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .filter-tag.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .content {
            padding: 50px 40px;
        }

        h2 {
            font-size: 2.2em;
            margin: 50px 0 30px 0;
            color: #667eea;
            border-bottom: 4px solid #667eea;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2:first-child {
            margin-top: 0;
        }

        h2 .emoji {
            font-size: 1.2em;
        }

        .article {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
            position: relative;
        }

        .article:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .article.featured {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eaf6 100%);
            border: 2px solid #764ba2;
        }

        .article-number {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
        }

        .article h3 {
            font-size: 1.6em;
            margin-bottom: 15px;
            color: #2c3e50;
            padding-right: 70px;
            line-height: 1.4;
        }

        .article h3 a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s;
        }

        .article h3 a:hover {
            color: #667eea;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .tag {
            padding: 5px 14px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover {
            background: #1976d2;
            color: white;
        }

        .tag.source-tag {
            background: #e8f5e9;
            color: #388e3c;
        }

        .tag.source-tag:hover {
            background: #388e3c;
            color: white;
        }

        .tag.date-tag {
            background: #fff3e0;
            color: #f57c00;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 18px 0;
            font-size: 0.95em;
            color: #6c757d;
        }

        .summary {
            margin: 20px 0;
            color: #495057;
            line-height: 1.9;
            font-size: 1.05em;
        }

        .insight {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffa726;
            padding: 0;
            margin-top: 25px;
            border-radius: 8px;
            color: #37474f;
            overflow: hidden;
        }

        .insight-header {
            background: rgba(255, 167, 38, 0.15);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 167, 38, 0.3);
        }

        .insight-header strong {
            color: #e65100;
            font-size: 1.15em;
        }

        .insight-header .word-count {
            color: #f57c00;
            font-size: 0.85em;
            font-weight: 500;
        }

        .insight-content {
            padding: 25px;
            line-height: 1.9;
            font-size: 1.02em;
        }

        .insight-content h4 {
            color: #e65100;
            font-size: 1.25em;
            margin: 20px 0 12px 0;
            font-weight: 600;
        }

        .insight-content h5 {
            color: #f57c00;
            font-size: 1.1em;
            margin: 16px 0 10px 0;
            font-weight: 600;
        }

        .insight-content p {
            margin: 12px 0;
            text-align: justify;
        }

        .insight-content ul {
            margin: 12px 0;
            padding-left: 25px;
        }

        .insight-content ul li {
            margin: 8px 0;
            line-height: 1.75;
        }

        .insight-content strong {
            color: #e65100;
            font-weight: 600;
        }

        .category-section {
            margin: 40px 0;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
        }

        .category-section h3 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 25px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.4em;
            margin-bottom: 20px;
        }

        .count {
            font-size: 0.75em;
            opacity: 0.95;
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 25px;
        }

        .article-item {
            padding: 25px;
            border-bottom: 1px solid #dee2e6;
            transition: background 0.2s;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-item:hover {
            background: white;
        }

        .article-item h4 {
            font-size: 1.25em;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .article-item h4 a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s;
        }

        .article-item h4 a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 40px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 0.95em;
            border-top: 2px solid #e9ecef;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .content, .filter-bar {
                padding: 25px 20px;
            }

            header {
                padding: 35px 20px;
            }

            header h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.6em;
            }

            .article-number {
                width: 40px;
                height: 40px;
                font-size: 1.2em;
            }

            .article h3 {
                font-size: 1.3em;
                padding-right: 55px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 每日资讯报告</h1>
            <p>{{DATE}} | 共 {{TOTAL_COUNT}} 篇文章 | Top {{TOP_COUNT}} 精选</p>
        </header>

        <div class="filter-bar">
            <span class="filter-label">🔍 筛选标签：</span>
            <div class="filter-tag active" data-filter="all">全部</div>
            {{FILTER_TAGS}}
        </div>

        <div class="content">
            <h2><span class="emoji">⭐</span>{{SECTION_TITLE}}</h2>
            {{TOP_ARTICLES}}

            <h2><span class="emoji">📰</span>全部资讯概要</h2>
            {{ALL_ARTICLES}}
        </div>

        <footer>
            <p><strong>📈 本报告由 RSS Digest AI 自动生成</strong></p>
            <p>生成时间: {{DATE}} | <a href="https://github.com">GitHub</a></p>
        </footer>
    </div>

    <script>
        // Tag filtering
        document.addEventListener('DOMContentLoaded', function() {
            const filterTags = document.querySelectorAll('.filter-tag');
            const articles = document.querySelectorAll('.article, .article-item');

            filterTags.forEach(tag => {
                tag.addEventListener('click', function() {
                    const filter = this.getAttribute('data-filter');

                    // Update active state
                    filterTags.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // Filter articles
                    articles.forEach(article => {
                        const articleTags = Array.from(article.querySelectorAll('.tag')).map(t => t.textContent.toLowerCase());

                        if (filter === 'all') {
                            article.classList.remove('hidden');
                        } else {
                            if (articleTags.some(t => t.includes(filter.toLowerCase()))) {
                                article.classList.remove('hidden');
                            } else {
                                article.classList.add('hidden');
                            }
                        }
                    });
                });
            });

            // Tag click to filter
            document.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    const filterValue = this.textContent.trim();
                    const matchingFilter = Array.from(filterTags).find(ft =>
                        ft.getAttribute('data-filter').toLowerCase() === filterValue.toLowerCase()
                    );

                    if (matchingFilter) {
                        matchingFilter.click();
                    }
                });
            });
        });
    </script>
</body>
</html>
